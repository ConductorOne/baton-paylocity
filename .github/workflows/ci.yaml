name: ci
on: pull_request

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Go Unit Tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: Annotate Go Tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    env:
      BATON_CLIENT_ID: test-client-id
      BATON_CLIENT_SECRET: test-client-secret
      BATON_BASE_URL: http://localhost:8080
      BATON_COMPANY_ID: test-company
      BATON_LOG_LEVEL: debug

      BATON_PAYLOCITY_CLIENT_ID: test-client-id
      BATON_PAYLOCITY_CLIENT_SECRET: test-client-secret
      BATON_PAYLOCITY_COMPANY_ID: test-company
      BATON_PAYLOCITY_BASE_URL: http://localhost:8080

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build test server
        run: go build -o test-server ./cmd/test_server
      - name: Start test server
        run: ./test-server &
      - name: Wait for test server to start
        run: sleep 5

      - name: Install baton
        run: ./scripts/get-baton.sh && mv baton /usr/local/bin

      - name: Build baton-paylocity
        run: go build ./cmd/baton-paylocity
      - name: Run baton-paylocity (sync)
        run: ./baton-paylocity

      - name: Verify users were synced
        run: baton resources --output-format json | jq --exit-status '.resources | map(select(.resourceType.id == "user")) | length == 4'

      - name: Verify positions (roles) were synced
        run: baton resources --output-format json | jq --exit-status '.resources | map(select(.resourceType.id == "role")) | length == 3'

      - name: Verify grants were created
        run: baton grants --output-format json | jq --exit-status '.grants | length == 4'